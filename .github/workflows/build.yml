name: PowerBox build

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  android:
    name: Android dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: twizypb-android
          path: app/build/outputs/apk/debug/app-debug.apk

  firmware:
    name: Headless telemetry firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: twizypb-telemetry
          path: firmware/.pio/build/m5stick-c-plus2/firmware.bin

  tuner:
    name: Headless tuner v12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d tuner
      - uses: actions/upload-artifact@v4
        with:
          name: twizypb-tuner-v12
          path: tuner/.pio/build/tuner-v12-headless/firmware.bin

  release:
    name: Publish shared release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish PowerBox v1.0.0'))
    needs: [android, firmware, tuner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: |
          cp dist/twizypb-telemetry/firmware.bin TwizyPB-v1.0.0-telemetry-safe.bin
          cp dist/twizypb-tuner-v12/firmware.bin TwizyPB-v1.0.0-tuner-v12.bin
          cp dist/twizypb-android/app-debug.apk TwizyPB-v1.0.0-android.apk
          sha256sum TwizyPB-v1.0.0-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PowerBox v1.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            TwizyPB-v1.0.0-telemetry-safe.bin
            TwizyPB-v1.0.0-tuner-v12.bin
            TwizyPB-v1.0.0-android.apk
            SHA256SUMS.txt
